services:
  game:
    build: .
    container_name: game_base
    # SFML precisa de display. X11 forwarding via socket do host.
    # Antes de rodar: xhost +local:docker
    environment:
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./database.db:/app/database.db
    network_mode: host
